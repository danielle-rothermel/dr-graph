# PyPI Trusted Publisher configuration must name this repository,
# `.github/workflows/release.yml`, and the `pypi` environment.
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"

      - name: Verify tag matches project version
        run: |
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())
          expected = f"v{project['project']['version']}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match {expected!r}"
              )
          print(f"release tag matches project version: {actual}")
          PY

      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Sync locked development environment
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Lint
        run: uv run --locked ruff check

      - name: Type check
        run: uv run --locked ty check

      - name: Test source checkout
        run: uv run --locked pytest

      - name: Build distributions
        run: uv build --clear

      - name: Verify distribution contents and metadata
        id: distributions
        run: |
          uv run --no-project python - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import tomllib
          import zipfile

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          wheel = Path(f"dist/dr_graph-{version}-py3-none-any.whl")
          sdist = Path(f"dist/dr_graph-{version}.tar.gz")
          expected = {wheel, sdist}
          actual = {
              path
              for path in Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          if actual != expected:
              raise SystemExit(
                  "unexpected distributions: "
                  f"expected {sorted(map(str, expected))}, "
                  f"found {sorted(map(str, actual))}"
              )

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              metadata_names = [
                  name for name in names if name.endswith(".dist-info/METADATA")
              ]
              wheel_names = [
                  name for name in names if name.endswith(".dist-info/WHEEL")
              ]
              if len(metadata_names) != 1 or len(wheel_names) != 1:
                  raise SystemExit("wheel must contain one METADATA and one WHEEL")
              if "dr_graph/py.typed" not in names:
                  raise SystemExit("wheel does not contain dr_graph/py.typed")
              wheel_metadata = BytesParser().parsebytes(
                  archive.read(metadata_names[0])
              )
              wheel_record = BytesParser().parsebytes(archive.read(wheel_names[0]))

          with tarfile.open(sdist, "r:gz") as archive:
              names = set(archive.getnames())
              metadata_names = [name for name in names if name.endswith("/PKG-INFO")]
              if len(metadata_names) != 1:
                  raise SystemExit("sdist must contain one PKG-INFO")
              if f"dr_graph-{version}/src/dr_graph/py.typed" not in names:
                  raise SystemExit("sdist does not contain src/dr_graph/py.typed")
              member = archive.extractfile(metadata_names[0])
              if member is None:
                  raise SystemExit("could not read sdist PKG-INFO")
              sdist_metadata = BytesParser().parse(member)

          for metadata in (wheel_metadata, sdist_metadata):
              if metadata["Name"] != project["name"]:
                  raise SystemExit(f"unexpected project name: {metadata['Name']!r}")
              if metadata["Version"] != version:
                  raise SystemExit(f"unexpected project version: {metadata['Version']!r}")
              if metadata["Requires-Python"] != project["requires-python"]:
                  raise SystemExit(
                      f"unexpected Requires-Python: {metadata['Requires-Python']!r}"
                  )

          wheel_requirements = wheel_metadata.get_all("Requires-Dist", [])
          sdist_requirements = sdist_metadata.get_all("Requires-Dist", [])
          if not wheel_requirements or wheel_requirements != sdist_requirements:
              raise SystemExit("wheel and sdist dependencies must be present and equal")
          if wheel_record["Wheel-Version"] != "1.0":
              raise SystemExit(
                  f"unexpected Wheel-Version: {wheel_record['Wheel-Version']!r}"
              )

          print(
              f"verified {project['name']} {version}; "
              f"Requires-Python: {wheel_metadata['Requires-Python']}; "
              f"Requires-Dist: {wheel_requirements}"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"wheel={wheel}\n")
              output.write(f"sdist={sdist}\n")
          PY

      - name: Test installed wheel
        run: >-
          uv run --isolated --no-project
          --with pytest==9.1.1
          --with "${{ steps.distributions.outputs.wheel }}"
          pytest

      - name: Test installed source distribution
        run: >-
          uv run --isolated --no-project
          --with pytest==9.1.1
          --with "${{ steps.distributions.outputs.sdist }}"
          pytest

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            ${{ steps.distributions.outputs.wheel }}
            ${{ steps.distributions.outputs.sdist }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dr-graph
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
