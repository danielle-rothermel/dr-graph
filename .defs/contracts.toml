# Binding contracts for dr-graph. Each entry is a standing rule; optional
# checks are exact commands that verify the stated behavior.

[[contracts]]
title = "Single-terminal DAG configs"
statement = """
Every graph definition and graph config contains at least one uniquely named \
node, has only valid upstream references, is acyclic, and designates exactly \
one terminal node that no other node consumes and that is the graph's only \
sink."""
rationale = """
A graph must admit dependency-ordered interpretation and a single aggregate \
output or terminal failure. Allowing cycles, dangling references, or multiple \
sinks would make that interpretation or terminal meaning ambiguous."""
date = "2026-08-05"
check = "uv run pytest tests/configuration/test_graphs.py tests/definitions/test_graphs.py"

[[contracts]]
title = "Exact declared variable materialization"
statement = """
Materializing a graph definition binds exactly every graph-variable name \
declared by every node definition; assignments for unknown nodes, missing \
variables, and undeclared variables are rejected."""
rationale = """
Implicit defaults and ignored assignments would make a reusable definition \
materialize differently from what it declares. Exact binding keeps the \
resulting graph config complete and auditable."""
date = "2026-08-05"
check = "uv run pytest tests/definitions/test_materialization.py"

[[contracts]]
title = "Complete graph identity"
statement = """
A graph hash is the full lowercase SHA-256 identity hash of the versioned \
graph config identity document; its payload contains every ordered static \
graph-config field, including concrete graph-variable values, and contains no \
runtime inputs, node outputs, provenance, or orchestration state."""
rationale = """
The identifier must change whenever executable static configuration changes \
and remain stable across runs of that same configuration. Truncation, omitted \
static fields, or runtime fields would respectively weaken uniqueness, create \
identity collisions, or confuse configuration identity with run identity."""
date = "2026-08-05"
check = "uv run pytest tests/identity"

[[contracts]]
title = "Deterministic caller-supplied interpretation"
statement = """
A graph run visits nodes in deterministic topological order, resolves each \
runnable node's declared inputs, and invokes the caller-supplied node runner \
once for each runnable node that is not completed; failed dependencies block \
their downstream nodes."""
rationale = """
The graph layer owns traversal and wiring while the caller owns node behavior. \
A stable order makes equivalent runs inspectable and reproducible without \
teaching the graph layer any domain-specific dispatch."""
date = "2026-08-05"
check = "uv run pytest tests/execution"

[[contracts]]
title = "Completed outputs validated before execution"
statement = """
All caller-supplied completed node outputs are validated before any node runner \
invocation: each id names a graph node, each value is a valid node output that \
contains every declared output field, and the completed set is dependency-\
closed; accepted nodes become successful outcomes with outcome_source=reused \
and are not invoked."""
rationale = """
Partial validation after execution begins could mix trusted new work with an \
invalid continuation state. Dependency closure ensures every reused output has \
the reused prerequisites needed to make that state coherent. Recording \
outcome_source=reused makes reuse recoverable for accounting without conflating \
outcome state with provenance."""
date = "2026-08-11"
check = "uv run pytest tests/results/test_continuation.py"

[[contracts]]
title = "Coherent strict-JSON graph results"
statement = """
Direct GraphRunResult construction accepts only strict-JSON boundary values, \
requires a nonempty outcome mapping whose keys match the outcomes' node ids, \
and requires execution_order to name every recorded outcome exactly once. The \
terminal node id must identify a recorded outcome; aggregate status and any \
terminal error must match that outcome; and success requires every recorded \
outcome to succeed. execute_graph validates and snapshots external inputs before \
invoking any node, produces graph-complete outcomes in deterministic topological \
order, and selects terminal_output from the configured terminal node's primary \
output field."""
rationale = """
Results cross serialization boundaries and must remain persistable without \
lossy coercion; rejecting invalid inputs before execution prevents side effects \
that cannot produce a valid result. Without a GraphConfig, the result model \
cannot prove graph \
membership, topological order, or that terminal_output equals the configured \
primary output; those graph-aware guarantees belong to execute_graph. Direct \
construction instead rejects contradictions that its recorded evidence can \
establish on its own."""
date = "2026-08-11"
check = "uv run --locked pytest tests/results/test_graph_runs.py tests/results/test_json_boundaries.py tests/results/test_node_outcomes.py tests/results/test_failure_diagnostics.py tests/execution/test_interpreter.py"

[[contracts]]
title = "Failure evidence retention"
statement = """
NodeError snapshots capture exception tracebacks. Metadata extraction records \
any dropped keys in metadata under the dropped_metadata marker with a reason \
class rather than silently omitting them. InputResolutionError and \
NodeExecutionError carry failure_class=infrastructure. When execute_graph is \
interrupted by CancelledError or KeyboardInterrupt, the in-flight node is \
cancelled, remaining nodes are blocked, a partial GraphRunResult is built, \
and GraphRunInterruptedError carries that result before the interruption \
re-raises."""
rationale = """
Downstream attribution, reflection, and accounting need stable failure \
evidence at graph-run boundaries. Silent metadata narrowing or interruption \
without partial results would destroy inspectable state at the volume and \
cost sensitivity of calibration workloads."""
date = "2026-08-11"
check = "uv run --locked pytest tests/results/test_failure_diagnostics.py tests/execution/test_interpreter.py tests/execution/test_input_resolution.py tests/execution/test_node_invocation.py"

[[contracts]]
title = "Callers own orchestration and domain behavior"
statement = """
Callers own node-type behavior, scheduling, retries, persistence, durability, \
provider and domain semantics, provenance content, and attempt-evidence \
storage; dr-graph owns graph structure, identity, deterministic traversal, \
input resolution, result shapes, and references to caller-owned evidence."""
rationale = """
Embedding orchestration or domain policy in the graph package would couple a \
general graph contract to one execution platform. The injected node runner \
and reference-only evidence boundary keep those responsibilities explicit."""
date = "2026-08-05"

[[contracts]]
title = "Exact ordered minimum-cost flow"
statement = """
solve_min_cost_flow sends exactly the requested nonnegative integer flow at \
minimum total cost through declared nonnegative-capacity, nonnegative-integer-\
cost arcs. The result reports every arc in declaration order, and equal-cost \
choices follow declared node and arc order deterministically."""
rationale = """
Exact flow, exact cost, and declared-order results make the primitive suitable \
for reproducible optimization and downstream accounting. Implicit iteration \
order or omitted zero-flow arcs would make equal optima and result alignment \
unstable across callers."""
date = "2026-08-06"
check = "uv run --locked pytest tests/flow"

[[contracts]]
title = "Balanced separable transportation"
statement = """
Every separable transport problem has equal total supply and demand; omitted \
cells are unavailable, and each declared cell contributes one unit of capacity \
per nonnegative, nondecreasing marginal cost. solve_separable_transport returns \
an exact minimum-cost allocation matrix in source and destination index order \
or raises typed infeasibility when available connected capacity is insufficient."""
rationale = """
These rules give missing routes, capacity, convex cost, and output coordinates \
one unambiguous meaning. Treating missing cells as zero-cost routes or accepting \
decreasing marginals would solve a different optimization problem."""
date = "2026-08-06"
check = "uv run --locked pytest tests/flow/transport"
